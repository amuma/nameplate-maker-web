<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名札ジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <h1>名札ジェネレーター</h1>
      <p>参加者CSVと背景画像から、80mm × 45mm の名札を作成し、A4印刷用PDFに出力します。</p>
    </div>
  </header>

  <main class="layout">
    <section class="panel controls">
      <h2>1. データを読み込む</h2>

      <label class="field">
        <span>参加者名簿 CSV</span>
        <input id="csvFile" type="file" accept=".csv,text/csv" />
        <small>「name」または「名前」列を優先。見つからない場合は先頭列を使用します。UTF-8 / Shift-JIS対応。</small>
      </label>

      <label class="field">
        <span>背景画像</span>
        <input id="bgFile" type="file" accept="image/*" />
        <small>16:9推奨。PNG / JPG対応。名札全面にトリミングして配置します。</small>
      </label>

      <div class="two-columns">
        <label class="field">
          <span>日本語フォント</span>
          <select id="jpFont">
            <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
            <option value="'Noto Serif JP', serif">Noto Serif JP</option>
            <option value="'Yu Gothic', 'YuGothic', sans-serif">游ゴシック</option>
            <option value="'Meiryo', sans-serif">メイリオ</option>
          </select>
        </label>

        <label class="field">
          <span>アルファベットフォント</span>
          <select id="latinFont">
            <option value="'Inter', sans-serif">Inter</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
          </select>
        </label>
      </div>

      <div class="two-columns">
        <label class="field">
          <span>文字色</span>
          <input id="nameColor" type="color" value="#ffffff" />
        </label>

        <label class="field">
          <span>ボックス濃度</span>
          <div class="range-row">
            <input id="overlayOpacity" type="range" min="0" max="0.9" step="0.05" value="0.55" />
            <output id="opacityValue">55%</output>
          </div>
        </label>
      </div>

      <div class="actions">
        <button id="pdfButton" class="primary" disabled>A4 PDFを出力</button>
        <button id="clearButton" class="secondary">クリア</button>
      </div>

      <div id="status" class="status" aria-live="polite">CSVと背景画像を選択してください。</div>
    </section>

    <section class="panel preview-panel">
      <div class="section-title">
        <div>
          <h2>2. プレビュー</h2>
          <p id="countLabel">0名</p>
        </div>
      </div>

      <div id="previewEmpty" class="empty">
        CSVと背景画像を読み込むと、ここに名札が表示されます。
      </div>

      <div id="previewGrid" class="preview-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>処理はすべてブラウザ内で行われます。アップロードしたCSV・画像はサーバーへ送信されません。</p>
  </footer>

  <div id="renderArea" class="render-area" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
